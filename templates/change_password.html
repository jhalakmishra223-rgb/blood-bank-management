{% extends "base.html" %}

{% block title %}Change Password | BloodBridge{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8">

                <div class="card shadow-lg border-0 rounded-4 glass-card">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i class="bi bi-shield-lock-fill text-danger display-3"></i>

                            <h2 class="fw-bold mt-3">
                                Change Password
                            </h2>

                            <p class="text-muted">
                                Keep your BloodBridge account secure by updating your password.
                            </p>

                        </div>

                        <form method="POST">

                            {% csrf_token %}

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Current Password
                                </label>

                                <input
                                    type="password"
                                    name="current_password"
                                    class="form-control form-control-lg"
                                    placeholder="Enter current password"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    New Password
                                </label>

                                <input
                                    type="password"
                                    name="new_password"
                                    class="form-control form-control-lg"
                                    placeholder="Enter new password"
                                    required>

                            </div>

                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Confirm New Password
                                </label>

                                <input
                                    type="password"
                                    name="confirm_password"
                                    class="form-control form-control-lg"
                                    placeholder="Confirm new password"
                                    required>

                            </div>

                            <div class="d-grid mb-3">

                                <button class="btn btn-danger btn-lg rounded-pill">

                                    <i class="bi bi-check-circle-fill me-2"></i>

                                    Change Password

                                </button>

                            </div>

                            <div class="text-center">

                                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary rounded-pill px-4">

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>
</section>

{% endblock %}
